name: Auto Release

on:
  schedule:
    - cron: '30 0 * * *' # Executa diariamente às 00:30 UTC
  workflow_dispatch: # Permite execução manual

jobs:
  release-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/yt-dlp/yt-dlp.git || true
          git fetch upstream --tags

      - name: Create Release for Latest Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git tag -l --sort=-v:refname | head -n 1)
          
          if [ -n "$LATEST_TAG" ]; then
            echo "Última tag encontrada: $LATEST_TAG"
            git push origin "$LATEST_TAG" || true
            
            if ! gh release view "$LATEST_TAG" >/dev/null 2>&1; then
              echo "A criar nova release para: $LATEST_TAG"
              gh release create "$LATEST_TAG" --title "yt-dlp $LATEST_TAG" --notes "Release sincronizada automaticamente a partir do repositório oficial do yt-dlp."
            else
              echo "A release $LATEST_TAG já existe."
            fi
          fi
