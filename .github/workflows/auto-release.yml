name: Release New Version

on:
  schedule:
    - cron: '30 0 * * *' # Roda todo dia às 00:30 (logo após a sincronização)
  workflow_dispatch: # Permite rodar manualmente se preferir

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check latest upstream tag
        id: upstream_tag
        run: |
          # Pega a tag mais recente do repositório oficial do yt-dlp
          LATEST_TAG=$(git ls-remote --tags --refs --sort="v:refname" https://github.com/yt-dlp/yt-dlp.git | tail -n1 | sed 's|refs/tags/||')
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          # Pega a última tag existente no seu fork
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          
          echo "Latest upstream: $LATEST_TAG"
          echo "Current fork: $CURRENT_TAG"

      - name: Sync tags and create Release if new version exists
        if: steps.upstream_tag.outputs.latest_tag != steps.upstream_tag.outputs.current_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.upstream_tag.outputs.latest_tag }}
        run: |
          # Configura identidade do Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Puxa as tags do upstream
          git remote add upstream https://github.com/yt-dlp/yt-dlp.git
          git fetch upstream --tags
          
          # Dá push da nova tag para o seu repositório
          git push origin $NEW_TAG
          
          # Cria a Release no GitHub automaticamente para essa tag
          gh release create "$NEW_TAG" --title "yt-dlp $NEW_TAG" --notes "Atualização automática sincronizada com o repositório oficial do yt-dlp."
