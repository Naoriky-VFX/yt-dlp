name: Release New Version

on:
  schedule:
    - cron: '30 0 * * *' # Roda todo dia às 00:30 (logo após a sincronização)
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/yt-dlp/yt-dlp.git || true
          git fetch upstream --tags

      - name: Sync and Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pega a tag mais recente do upstream
          LATEST_TAG=$(git tag -l --sort=-v:refname | head -n 1)
          
          if [ -n "$LATEST_TAG" ]; then
            echo "A tag mais recente encontrada é: $LATEST_TAG"
            
            # Garante que a tag está no seu repositório remoto (origin)
            git push origin "$LATEST_TAG" || true
            
            # Cria a release caso ela ainda não exista
            if ! gh release view "$LATEST_TAG" >/dev/null 2>&1; then
              echo "Criando nova release para $LATEST_TAG..."
              gh release create "$LATEST_TAG" --title "yt-dlp $LATEST_TAG" --notes "Release sincronizada automaticamente a partir do repositório oficial do yt-dlp."
            else
              echo "A release $LATEST_TAG já existe no repositório."
            fi
          else
            echo "Nenhuma tag encontrada."
          fi
