name: Release All Versions

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  release-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/yt-dlp/yt-dlp.git || true
          git fetch upstream --tags

      - name: Create Missing Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pega todas as tags do yt-dlp ordenadas da mais antiga para a mais recente
          TAGS=$(git tag -l --sort=v:refname)
          
          for TAG in $TAGS; do
            # Ignora tags de teste ou pré-lançamento indesejadas se necessário
            echo "A verificar a tag: $TAG"
            
            # Garante que a tag está no seu fork
            git push origin "$TAG" || true
            
            # Se a release ainda não existir, cria-a automaticamente
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "A criar release em falta para: $TAG"
              gh release create "$TAG" --title "yt-dlp $TAG" --notes "Release sincronizada automaticamente a partir do repositório oficial do yt-dlp."
            else
              echo "A release $TAG já existe."
            fi
          done
