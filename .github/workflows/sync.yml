name: Sync Fork

on:
  schedule:
    # Roda todos os dias à meia-noite (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sincronizar com o repositório original
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          upstream_sync_repo: yt-dlp/yt-dlp
          upstream_sync_branch: master
          target_branch: master
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false
