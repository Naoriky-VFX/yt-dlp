name: Build All Platforms by Date

on:
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            arch: x64
            artifact_name: yt-dlp.exe
            zip_name: yt-dlp_win.zip
            pyinstaller_args: "--onefile --name yt-dlp --clean"
          # Windows ARM64
          - os: windows-latest
            arch: arm64
            artifact_name: yt-dlp_arm64.exe
            zip_name: yt-dlp_win_arm64.zip
            pyinstaller_args: "--onefile --name yt-dlp_arm64 --clean"
          # Windows x86 (32-bit)
          - os: windows-latest
            arch: x86
            artifact_name: yt-dlp_x86.exe
            zip_name: yt-dlp_win_x86.zip
            pyinstaller_args: "--onefile --name yt-dlp_x86 --clean"
          # Linux x64
          - os: ubuntu-latest
            arch: linux-x64
            artifact_name: yt-dlp_linux
            zip_name: yt-dlp_linux.zip
            pyinstaller_args: "--onefile --name yt-dlp_linux --clean"
          # Linux ARM64 (aarch64)
          - os: ubuntu-latest
            arch: linux-aarch64
            artifact_name: yt-dlp_linux_aarch64
            zip_name: yt-dlp_linux_aarch64.zip
            pyinstaller_args: "--onefile --name yt-dlp_linux_aarch64 --clean"
          # Linux Musl (Alpine / musllinux)
          - os: ubuntu-latest
            arch: musllinux
            artifact_name: yt-dlp_musllinux
            zip_name: yt-dlp_musllinux.zip
            pyinstaller_args: "--onefile --name yt-dlp_musllinux --clean"
          # macOS
          - os: macos-latest
            arch: macos
            artifact_name: yt-dlp_macos
            zip_name: yt-dlp_macos.zip
            pyinstaller_args: "--onefile --name yt-dlp_macos --clean"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install dependencies (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          # Envolvido em aspas para satisfazer o ShellCheck / actionlint
          python "$(find . -name "make_lazy_loader.py" -print -quit)"
          pyinstaller yt_dlp/__main__.py ${{ matrix.pyinstaller_args }}

      - name: Package into ZIP as well
        shell: bash
        run: |
          mkdir -p dist-zip
          cd dist
          if [ -f "${{ matrix.artifact_name }}" ]; then
            zip "../dist-zip/${{ matrix.zip_name }}" "${{ matrix.artifact_name }}"
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.arch }}-bin
          path: dist/${{ matrix.artifact_name }}

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.arch }}-zip
          path: dist-zip/${{ matrix.zip_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets

      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG=$(date +"%Y.%m.%d")
          echo "A processar versão: $TAG"

          git tag -d "$TAG" 2>/dev/null || true
          git push origin --delete "$TAG" 2>/dev/null || true

          git tag "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" --title "yt-dlp $TAG" --notes "Versão compilada automaticamente para Windows, Linux e macOS em $(date +'%d/%m/%Y')." || true

          # Envia todos os binários e ficheiros .zip gerados para os assets da release
          shopt -s globstar nullglob
          for file in all-assets/**/*; do
            if [ -f "$file" ]; then
              echo "A enviar $file para a release..."
              gh release upload "$TAG" "$file" --clobber
            fi
          done
          
          echo "Sucesso! Todas as versões e ficheiros zip foram compilados e enviados para a release $TAG."
