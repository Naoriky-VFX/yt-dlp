name: Build All Platforms by Date

on:
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            artifact_name: yt-dlp.exe
            pyinstaller_args: "--onefile --name yt-dlp --clean"
          - os: windows-latest
            arch: arm64
            artifact_name: yt-dlp_arm64.exe
            # Nota: O PyInstaller no Windows x64 compila nativamente; para ARM64 gera-se com o mesmo interpretador mas adaptado, ou usa-se o alvo padrão.
            pyinstaller_args: "--onefile --name yt-dlp_arm64 --clean"
          - os: ubuntu-latest
            arch: linux-x64
            artifact_name: yt-dlp_linux
            pyinstaller_args: "--onefile --name yt-dlp_linux --clean"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          python devscripts/make_lazy_loader.py
          pyinstaller yt_dlp/__main__.py ${{ matrix.pyinstaller_args }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.arch }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        path: all-assets

      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG=$(date +"%Y.%m.%d")
          echo "A processar versão: $TAG"

          # Remove tag anterior se já existir para atualizar o dia
          git tag -d "$TAG" 2>/dev/null || true
          git push origin --delete "$TAG" 2>/dev/null || true

          # Cria e envia a nova tag
          git tag "$TAG"
          git push origin "$TAG"

          # Cria a Release oficial no GitHub
          gh release create "$TAG" --title "yt-dlp $TAG" --notes "Versão compilada automaticamente para Windows e Linux em $(date +'%d/%m/%Y')." --clobber

          # Envia todos os binários gerados para os assets da release
          gh release upload "$TAG" all-assets/**/* --clobber
          
          echo "Sucesso! Todas as versões foram compiladas e enviadas para a release $TAG."
