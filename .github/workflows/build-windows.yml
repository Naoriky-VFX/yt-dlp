name: Build Windows by Date

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          python devscripts/make_lazy_loader.py
          pyinstaller yt_dlp/__main__.py --onefile --name yt-dlp --clean

      - name: Create Release and Upload Executable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $TAG = Get-Date -Format "yyyy.MM.dd"
          Write-Host "A processar versão: $TAG"

          # Remove tag anterior caso já exista
          git tag -d $TAG 2>$null
          git push origin --delete $TAG 2>$null

          # Cria e envia a nova tag
          git tag $TAG
          git push origin $TAG

          # Cria a Release oficial e envia o yt-dlp.exe num só passo com a CLI do GitHub
          gh release create $TAG --title "yt-dlp $TAG" --notes "Versão compilada automaticamente para Windows em $(Get-Date -Format 'dd/MM/yyyy')." --clobber
          gh release upload $TAG "dist/yt-dlp.exe" --clobber
          
          Write-Host "Sucesso! yt-dlp.exe compilado e enviado para a release $TAG."
