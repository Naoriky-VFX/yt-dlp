name: Build Windows by Date

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          # Caminhos corrigidos para a estrutura oficial do yt-dlp
          python devscripts/make_lazy_loader.py
          pyinstaller yt_dlp/__main__.py --onefile --name yt-dlp --clean

      - name: Create Release and Upload Executable via REST API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $TAG = Get-Date -Format "yyyy.MM.dd"
          Write-Host "A processar versão: $TAG"

          git tag -d $TAG 2>$null
          git push origin --delete $TAG 2>$null

          git tag $TAG
          git push origin $TAG

          $repo = "${{ github.repository }}"
          $headers = @{
              "Authorization" = "token $env:GITHUB_TOKEN"
              "Accept" = "application/vnd.github+json"
          }

          $releaseBody = @{
              tag_name = $TAG
              name = "yt-dlp $TAG"
              body = "Versão compilada automaticamente para Windows em $(Get-Date -Format 'dd/MM/yyyy')."
              draft = $false
              prerelease = $false
          } | ConvertTo-Json

          $createReleaseUri = "https://api.github.com/repos/$repo/releases"
          $releaseResponse = Invoke-RestMethod -Uri $createReleaseUri -Method Post -Headers $headers -Body $releaseBody
          $uploadUrl = $releaseResponse.upload_url -replace '\{\?name,label\}', ''

          $filePath = "dist/yt-dlp.exe"
          $fileName = "yt-dlp.exe"
          $fileBytes = [System.IO.File]::ReadAllBytes($filePath)
          $uploadUri = "$uploadUrl?name=$fileName"
          
          $uploadHeaders = @{
              "Authorization" = "token $env:GITHUB_TOKEN"
              "Content-Type" = "application/octet-stream"
          }

          Invoke-RestMethod -Uri $uploadUri -Method Post -Headers $uploadHeaders -Body $fileBytes
          Write-Host "yt-dlp.exe enviado com sucesso para os assets!"
