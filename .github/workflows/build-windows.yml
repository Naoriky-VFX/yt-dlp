name: Build Windows by Date

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          python devscripts/make_lazy_loader.py
          pyinstaller yt-dlp.py --onefile --name yt-dlp --clean

      - name: Create Release and Upload Executable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Gera a versão baseada na data atual (ex: 2026.10.28)
          $TAG = Get-Date -Format "yyyy.MM.dd"
          Write-Host "A criar release para a versão: $TAG"

          # Se a tag já existir, apaga a tag antiga e a release para forçar a nova compilação do dia
          git tag -d $TAG 2>$null
          git push origin --delete $TAG 2>$null

          # Cria a nova tag e envia
          git tag $TAG
          git push origin $TAG

          # Cria a Release no GitHub
          gh release create $TAG --title "yt-dlp $TAG" --notes "Versão compilada automaticamente para Windows em $(Get-Date -Format 'dd/MM/yyyy')." --clobber

          # Envia o yt-dlp.exe para os assets
          gh release upload $TAG "dist/yt-dlp.exe" --clobber
